services:
  backend:
    image: bhiv/abhiruchi-backend:IMG_TAG
    container_name: abhiruchi-backend-prod
    restart: always
    ports:
      - "${BACKEND_PORT:-5004}:5000"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
    networks:
      - abhiruchi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: bhiv/abhiruchi-frontend:IMG_TAG
    container_name: abhiruchi-frontend-prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-5179}:5173"
    env_file:
      - path: ./client/.env
        required: false
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - abhiruchi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  abhiruchi-network:
    driver: bridge
