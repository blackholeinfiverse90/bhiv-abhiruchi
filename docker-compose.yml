services:
  mongo:
    image: mongo:6.0
    container_name: abhiruchi-mongo-dev
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27020}:27017"
    environment:
      - MONGO_INITDB_DATABASE=gurukul_assessment
    volumes:
      - abhiruchi_mongo_data:/data/db
    networks:
      - abhiruchi-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: abhiruchi-backend-dev
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/gurukul_assessment
      - CORS_ORIGIN=http://localhost:5173,http://localhost:5179
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - abhiruchi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5000/api
        - VITE_GROK_API_KEY=${VITE_GROK_API_KEY:-}
    container_name: abhiruchi-frontend-dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file:
      - path: ./client/.env
        required: false
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - abhiruchi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  abhiruchi_mongo_data:
    driver: local

networks:
  abhiruchi-network:
    driver: bridge
